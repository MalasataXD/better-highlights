# Builds better-highlights-lsp for each platform the extension downloads for, and publishes
# the archives to a GitHub release when a `v*` tag is pushed. Asset names must match
# `better-highlights-lsp-<target>.<zip|tar.gz>` in src/lib.rs.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p better-highlights-lsp --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="better-highlights-lsp-${{ matrix.target }}"
          cd "target/${{ matrix.target }}/release"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$GITHUB_WORKSPACE/$name.zip" better-highlights-lsp.exe
          else
            tar czf "$GITHUB_WORKSPACE/$name.tar.gz" better-highlights-lsp
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: better-highlights-lsp-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" better-highlights-lsp-* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
